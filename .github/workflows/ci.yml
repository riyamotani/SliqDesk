name: CI

on:
  push:
  pull_request:

# Cancel an older run of the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types, unit tests, integration tests against a real Postgres, build.
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sliqdesk
          POSTGRES_PASSWORD: sliqdesk
          POSTGRES_DB: sliqdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sliqdesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sliqdesk:sliqdesk@localhost:5432/sliqdesk?schema=test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  # The submission requirement, checked on every push: a clean checkout
  # starts with `docker compose up` and serves the seeded app through nginx.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test through nginx
        run: |
          curl --fail --silent http://localhost:8080/api/health
          curl --fail --silent --cookie-jar cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@acme.test","password":"password123"}' \
            http://localhost:8080/api/auth/login
          curl --fail --silent --cookie cookies.txt http://localhost:8080/api/tickets | grep -q '"total"'
          curl --fail --silent http://localhost:8080/ | grep -q '<div id="root">'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # REST API
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO: upgrade the connection to a WebSocket and keep it open.
  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  # Built assets have content hashes in their names, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths (e.g. /tickets/123) serve index.html and
  # React Router renders the right page.
  location / {
    try_files $uri /index.html;
  }
}
